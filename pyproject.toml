[project]
name = "mukundakatta-profile"
version = "0.0.0"
description = "Automation scripts that keep the GitHub profile README and stats badges in sync."
readme = "README.md"
requires-python = ">=3.11"
# The automation scripts use only the Python standard library, and the test
# suite runs on the stdlib ``unittest`` framework, so there are no runtime or
# test dependencies to install. Run the suite with:
#   python -m unittest discover -s tests
dependencies = []

[tool.ruff]
target-version = "py311"
